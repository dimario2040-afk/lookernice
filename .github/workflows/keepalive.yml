# MOG keep-alive + Render auto-deploy.
#
# Триггеры:
#   * schedule (*/14)  → только PING: бесплатный Render «засыпает» после ~15 мин
#     без ВХОДЯЩИХ запросов; внутренний self-ping бота (600с) уже держит его,
#     этот job — страховка снаружи (любой GET = входящий трафик).
#   * push в main      → только DEPLOY: триггерит деплой последнего коммита
#     на Render (секрет RENDER_DEPLOY_HOOK) — после git push прод сразу свежий.
#   * workflow_dispatch → ping + deploy вручную.
#
# Секрет: Settings → Secrets and variables → Actions → RENDER_DEPLOY_HOOK.
name: keepalive

on:
  schedule:
    # каждые 14 минут (Render засыпает на 15-й) — безопасно ниже порога
    - cron: "*/14 * * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render (anti-sleep)
        run: |
          set -euo pipefail
          BASE="https://lookernice-bot.onrender.com"
          # ЛЮБОЙ HTTP-ответ = входящий трафик => сервис не спит.
          for path in /healthz /; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 "$BASE$path" || echo "000")
            echo "GET $path -> $code"
          done

  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "Secret RENDER_DEPLOY_HOOK not set — skip."
            exit 0
          fi
          echo "Triggering Render deploy via hook..."
          curl -fsS -X POST "$HOOK" || true
